name: Sello_1991_Fabrica_Unicornio

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Instalando Motores
        run: echo "Iniciando compilación modo fantasma..."
      - name: Empaquetado APK
        run: |
          mkdir -p build
          echo "Generando binario..." > build/unicornio.txt
      - name: Enviar a Soberanía
        uses: actions/upload-artifact@v2
        with:
          name: APK_Sello_1991
          path: build/