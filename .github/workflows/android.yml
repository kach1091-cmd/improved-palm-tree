
name: Android CI

on:
  push:
	branches: [ main ]
  pull_request:
	branches: [ main ]

jobs:
  build:
	runs-on: ubuntu-latest

	steps:
	- uses: actions/checkout@v4
	- name: Set up JDK 17
	  uses: actions/setup-java@v4
	  with:
		java-version: '17'
		distribution: 'temurin'
	- name: Grant execute permission for gradlew
	  run: chmod +x gradlew
	- name: Build with Gradle
	  run: ./gradlew build
name: Sello_1991
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Sello
        run: echo "Victoria Final" > sello.txt
      - uses: actions/upload-artifact@v3
        with:
          name: APK_Sello_1991
          path: sello.txt