name: Synopsys Intelligent Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  synopsys-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Synopsys Intelligent Security Scan
        uses: synopsys-sig/synopsys-action@v1.12.0
        with:
          # Aquí forzamos el uso de Coverity
          coverity_url: "TU_URL_REAL"
          coverity_user: "TU_USUARIO"
          coverity_passphrase: "TU_PASSWORD"
          coverity_project_name: "improved-palm-tree"
          coverity_stream_name: "main"