# Este flujo de trabajo utiliza acciones que están certificadas por GitHub.
# Son proporcionadas por un tercero y están gobernadas por
# Terminos de servicio, política de privacidad y soporte separados.

name: Escaneo de Seguridad Inteligente Synopsys

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 16 * * 3' # Dura 16:29, solo el miércoles

jobs:
  synopsys-io:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Synopsys Intelligent Security Scan
        uses: synopsys-sig/synopsys-action@v1.12.0
        with:
          io_url: ${{ secrets.IO_URL }}
          io_token: ${{ secrets.IO_TOKEN }}