# Este flujo de trabajo utiliza acciones que están certificadas por GitHub.
# Son proporcionadas por un tercero y están gobernadas por
# Terminos de servicio, política de privacidad y soporte separados.

name: Escaneo de Seguridad Inteligente Synopsys

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 16 * * 3'

jobs:
  synopsys-io:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Synopsys Intelligent Security Scan
        uses: synopsys-sig/synopsys-action@v1.12.0
        with:
          coverity_url: ${{ secrets.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
          coverity_project_name: ${{ github.event.repository.name }}
          coverity_stream_name: ${{ github.event.repository.name }}-main